# Build the static site and publish it to GitHub Pages on every push to main.
# Repo setting required once: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the latest release's APK version (nitc-X.apk), so the map can tell an
      # out-of-date app; left empty if the release can't be read
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export VITE_APK_VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/pr0head/nitc/releases/latest \
            | grep -o '"name": *"nitc-[0-9.]*[0-9]\.apk"' | grep -o '[0-9][0-9.]*[0-9]' | head -1)
          echo "latest APK: ${VITE_APK_VERSION:-unknown}"
          npm run build
      # the latest APK rides along: the site offers it from its own origin
      - name: Latest APK
        run: >-
          curl -fsSL -o dist/nitc.apk https://github.com/pr0head/nitc/releases/latest/download/nitc.apk
          || echo "::warning::no nitc.apk in the latest release"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
