# Build the Android shell (android/) — a WebView around the published map.
# A tag v* builds a signed APK and attaches it to a GitHub Release; a manual
# run builds it as a workflow artifact only. Without the release key a manual
# run falls back to a debug-signed APK (fine for testing; it cannot update a
# release install), a tag fails.
# The shell only opens the site, so a release that didn't touch android/ (or
# this workflow) since the previous v* tag builds nothing: its release gets
# the previous release's APK as is, so /releases/latest always has one.
# Each release also carries the APK as plain nitc.apk (a stable /latest/download
# URL); both mirrors' sites pick it up, so after a release we redeploy them.
# Repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GITVERSE_TOKEN         to rerun the GitVerse Pages build
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release
  actions: write  # redeploy the site with the new APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, to compare with the previous release

      # BUILD=1 → build; else PREV names the release whose APK is reused
      - name: Changes since the previous release
        run: |
          prev=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          fi
          if [[ -n "$prev" ]] && git diff --quiet "$prev" HEAD -- android .github/workflows/android.yml; then
            echo "::notice::android/ unchanged since $prev — reusing its APK"
            echo "BUILD=0" >> "$GITHUB_ENV"; echo "PREV=$prev" >> "$GITHUB_ENV"
          else
            echo "BUILD=1" >> "$GITHUB_ENV"
          fi

      - name: Reuse the previous APK
        if: env.BUILD == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$PREV" --pattern 'nitc-*.apk'

      - if: env.BUILD == '1'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: env.BUILD == '1'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Version
        if: env.BUILD == '1'
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Release key
        if: env.BUILD == '1'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "::error::secret ANDROID_KEYSTORE_B64 is not set — see the header of this workflow"; exit 1
            fi
            echo "::warning::no release key — building a debug-signed APK"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        if: env.BUILD == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_FILE" ]]; then type=release; else type=debug; fi
          gradle -p android "assemble${type^}"
          cp "android/app/build/outputs/apk/$type/app-$type.apk" "nitc-$VERSION_NAME.apk"

      - name: Stable name
        run: cp nitc-*.apk nitc.apk

      - uses: actions/upload-artifact@v7
        with:
          name: nitc-apk
          path: nitc-*.apk

      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nitc-*.apk
            nitc.apk
          generate_release_notes: true

      - name: Redeploy both mirrors with the new APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITVERSE_TOKEN" \
            -H "Accept: application/vnd.gitverse.object+json;version=1" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.gitverse.ru/repos/pr0head/nitc/actions/workflows/pages.yaml/dispatches?branch=main" \
            || echo "::warning::could not rerun the GitVerse Pages build"
