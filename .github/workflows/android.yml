# Build the Android shell (android/) — a WebView around the published map.
# GitHub Releases carry the app only: a tag android-vX builds a signed APK of
# version X and releases it as nitc.apk (a stable /latest/download URL); the
# site ships from main and needs no release. A manual run builds the APK as a
# workflow artifact only. Without the release key a manual run falls back to a
# debug-signed APK (fine for testing; it cannot update a release install), a
# tag fails. Both mirrors' sites carry the latest nitc.apk and its version, so
# after a release we redeploy them.
# Repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GITVERSE_TOKEN         to rerun the GitVerse Pages build
name: Android APK

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write # create the release
  actions: write  # redeploy the site with the new APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then name="${GITHUB_REF_NAME#android-v}"; else name="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "::error::secret ANDROID_KEYSTORE_B64 is not set — see the header of this workflow"; exit 1
            fi
            echo "::warning::no release key — building a debug-signed APK"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_FILE" ]]; then type=release; else type=debug; fi
          gradle -p android "assemble${type^}"
          cp "android/app/build/outputs/apk/$type/app-$type.apk" nitc.apk

      - uses: actions/upload-artifact@v7
        with:
          name: nitc-apk-${{ env.VERSION_NAME }}
          path: nitc.apk

      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: NITC Android ${{ env.VERSION_NAME }}
          files: nitc.apk
          make_latest: true

      - name: Redeploy both mirrors with the new APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITVERSE_TOKEN" \
            -H "Accept: application/vnd.gitverse.object+json;version=1" \
            -H "Content-Type: application/json" -d '{}' \
            "https://api.gitverse.ru/repos/pr0head/nitc/actions/workflows/pages.yaml/dispatches?branch=main" \
            || echo "::warning::could not rerun the GitVerse Pages build"
